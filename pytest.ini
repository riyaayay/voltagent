[pytest]
# Takes precedence over [tool.pytest.ini_options] in pyproject.toml (same
# pythonpath/testpaths, plus markers). Delete that block when pyproject is next edited.
pythonpath = .
testpaths = tests
addopts = --strict-markers -ra
markers =
    unit: fast, no external services, no model downloads
    integration: needs real Elasticsearch/Qdrant from docker compose
    e2e: full pipeline through the API (TestClient) with the fake LLM
    chaos: fault-injection and fuzz runs; must uphold the safety contract
    live: calls a real paid LLM API; skipped unless -m live and a key is set
    slow: loads the embedding model or processes large documents
